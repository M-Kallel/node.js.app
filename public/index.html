<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TP To-Do App</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f3f4f6; margin: 0; padding: 2rem; }
    .card { max-width: 480px; margin: auto; background: #fff; padding: 1.5rem; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
    h1 { margin-top: 0; }
    .info { font-size: .8rem; color: #6b7280; margin-bottom: 1rem; }
    form { display: flex; gap: .5rem; }
    input { flex: 1; padding: .6rem; border: 1px solid #d1d5db; border-radius: 8px; }
    button { padding: .6rem 1rem; border: 0; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; align-items: center; padding: .6rem 0; border-bottom: 1px solid #e5e7eb; }
    li span { cursor: pointer; }
    li.done span { text-decoration: line-through; color: #9ca3af; }
    li button { background: #ef4444; padding: .3rem .6rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📝 To-Do List</h1>
    <div class="info" id="info">Chargement…</div>
    <form id="form">
      <input id="title" placeholder="Nouvelle tâche…" autocomplete="off">
      <button>Ajouter</button>
    </form>
    <ul id="list"></ul>
  </div>

  <script>
    const list = document.getElementById('list');

    async function loadInfo() {
      const i = await (await fetch('/api/info')).json();
      document.getElementById('info').textContent =
        `${i.app} • env: ${i.environment} • pod/hôte: ${i.hostname}`;
    }

    async function loadTasks() {
      const tasks = await (await fetch('/api/tasks')).json();
      list.innerHTML = '';
      tasks.forEach(t => {
        const li = document.createElement('li');
        if (t.done) li.className = 'done';
        const span = document.createElement('span');
        span.textContent = t.title;
        span.onclick = async () => { await fetch('/api/tasks/' + t.id, { method: 'PATCH' }); loadTasks(); };
        const del = document.createElement('button');
        del.textContent = 'X';
        del.onclick = async () => { await fetch('/api/tasks/' + t.id, { method: 'DELETE' }); loadTasks(); };
        li.append(span, del);
        list.appendChild(li);
      });
    }

    document.getElementById('form').onsubmit = async e => {
      e.preventDefault();
      const input = document.getElementById('title');
      if (!input.value.trim()) return;
      await fetch('/api/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: input.value })
      });
      input.value = '';
      loadTasks();
    };

    loadInfo();
    loadTasks();
  </script>
</body>
</html>
